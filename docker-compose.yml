services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_AI: "false"   # set to "true" for YOLOv8 + DeepSORT (larger image)
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/instance/shopmotion.db
    volumes:
      - shopmotion-data:/app/instance
    # Expose a USB camera to the container (Linux hosts):
    # devices:
    #   - /dev/video0:/dev/video0
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  shopmotion-data:
